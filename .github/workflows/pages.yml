# Publishes a static snapshot of the example screens to GitHub Pages.
# The build runs on GitHub's machines, which can reach Stooq for real prices.
name: Pages

on:
  push:
    branches: [ main ]
  schedule:
    - cron: "30 22 * * 1-5" # weekdays after the US close, to refresh prices
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Run the example screens and render static HTML
        run: bin/rails db:prepare demo:export

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: tmp/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
