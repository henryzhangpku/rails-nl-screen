# Publishes a static snapshot of the example screens to GitHub Pages.
# The build runs on GitHub's machines, which can reach Yahoo for real prices.
# The site is pushed to the gh-pages branch (Settings -> Pages -> Deploy from a branch: gh-pages).
name: Pages

on:
  push:
    branches: [ main ]
  schedule:
    - cron: "30 22 * * 1-5" # weekdays after the US close, to refresh prices
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Run the example screens and render static HTML
        run: bin/rails db:prepare demo:export

      - name: Push tmp/site to the gh-pages branch
        run: |
          cd tmp/site
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Demo snapshot from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
